name: Build Zadachi (Windows EXE + Android APK)

# Сборка стартует автоматически при каждом push, а также вручную
# (Actions -> Build Zadachi -> Run workflow). Тег v* дополнительно
# публикует GitHub Release с готовыми файлами.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  windows:
    name: Windows .exe (self-contained)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller (build-time only)
        run: python -m pip install --upgrade pyinstaller
      - name: Build one-file exe
        working-directory: windows
        run: python -m PyInstaller --noconfirm zadachi.spec
      - name: Smoke check
        working-directory: windows
        run: |
          if (!(Test-Path dist\Zadachi.exe)) { throw "Zadachi.exe not built" }
          Get-Item dist\Zadachi.exe | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: Zadachi-Windows
          path: windows/dist/Zadachi.exe
          if-no-files-found: error

  android:
    name: Android .apk (permanent key)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify permanent signing key
        run: keytool -list -keystore android/keystore/zadachi-release.keystore -storepass 'Zadachi2026!' -alias zadachi
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Verify APK signature
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p release && cp "$APK" release/Zadachi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zadachi-Android
          path: release/Zadachi.apk
          if-no-files-found: error

  release:
    name: Publish release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
